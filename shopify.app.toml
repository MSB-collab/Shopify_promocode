# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "74cc64d8161a03541628d8b4d6643964"
name = "deftcrew"
application_url = "https://shopifytdc-production.up.railway.app"
embedded = true
handle = "deftcrew"

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_price_rules,read_discounts,write_discounts,read_orders,read_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://shopifytdc-production.up.railway.app/auth/callback" ]

[pos]
embedded = false
